name: Latios S1a isolated Editor control

# Deliberate release only: ordinary stage pushes never run this lab.
# The exact-branch root-suite exclusion is justified by the fail-closed source check below.
on:
  push:
    branches: [dot/latios-lab-validate]
    paths: [Latios2022Lab/ci-request.json]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: latios-s1a-control
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      evidence-label: ${{ steps.release.outputs.evidence_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact P0 evidence and lab-only source
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNITY_SELF_HOSTED: ${{ vars.UNITY_SELF_HOSTED }}
        run: |
          test "$UNITY_SELF_HOSTED" = true || { echo "Approved native runner is disabled; lab remains NOT_RUN"; exit 1; }
          python3 Tools/ci/latios_lab_ci.py validate --github-output "$GITHUB_OUTPUT"
      - name: Run static launcher tests without Unity
        run: |
          python3 -m unittest discover -s Tools/ci -p test_latios_lab_ci.py -v
          python3 -m unittest discover -s Latios2022Lab/Tools -p 'test_*.py' -v

  editor-control:
    needs: release-gate
    runs-on: [self-hosted, unity]
    timeout-minutes: 180
    env:
      LAB_SOURCE: latios-s1a-source-${{ github.run_id }}-${{ github.run_attempt }}
      UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
    steps:
      - name: Initialize run-specific paths on the assigned runner
        shell: bash
        run: |
          : "${RUNNER_TEMP:?Missing runner temporary directory}"
          : "${GITHUB_RUN_ID:?Missing run ID}" "${GITHUB_RUN_ATTEMPT:?Missing run attempt}"
          printf 'LAB_WORKSPACE=%s/latios-s1a-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'LAB_EVIDENCE=%s/latios-s1a-evidence-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: ${{ env.LAB_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run isolated import and strict Burst on/off Editor gates
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$LAB_SOURCE"
          args=()
          if [ -n "$UNITY_EDITOR_PATH" ]; then args+=(--editor "$UNITY_EDITOR_PATH"); fi
          python3 Tools/ci/latios_lab_ci.py execute --workspace "$LAB_WORKSPACE" "${args[@]}"
      - name: Package original evidence and labelled early review
        if: always()
        shell: bash
        run: |
          cd "$LAB_SOURCE"
          python3 Tools/ci/latios_lab_ci.py package --workspace "$LAB_WORKSPACE" --output "$LAB_EVIDENCE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latios-s1a-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.release-gate.outputs.evidence-label }}-early-review
          path: ${{ env.LAB_EVIDENCE }}/early/
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latios-s1a-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.release-gate.outputs.evidence-label }}-part00
          path: ${{ env.LAB_EVIDENCE }}/parts/part00/
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
