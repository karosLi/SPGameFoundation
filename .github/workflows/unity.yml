name: Unity tests (EditMode + PlayMode UI automation)

# Runs the real Unity test suites in the official unityci/editor Docker image.
# Repository secrets:
#   Personal licence:  UNITY_LICENSE  (full contents of Unity_lic.ulf)
#   Pro / Plus:        UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD
# Note: a Personal licence file (.ulf) created by Unity Hub is bound to the machine that activated it and
# is rejected here ("TimeStamp validation failed"). Personal users: use unity-self-hosted.yml instead.
# Manual trigger only, so pushes don't show a red check while no cloud-usable licence is configured.
on:
  workflow_dispatch:

jobs:
  unity-tests:
    if: github.ref != 'refs/heads/dot/ci-evidence-recovery' && github.head_ref != 'dot/ci-evidence-recovery' && github.base_ref != 'dot/ci-evidence-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      SPF_ABILITY_GAMEPLAY_SEQUENCE: '1'
    steps:
      - name: Check licence secrets
        id: licence
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE (Personal .ulf contents) or UNITY_SERIAL is not set — email/password alone cannot activate a Personal licence. Skipping Unity tests."
          fi

      - uses: actions/checkout@v4
        if: steps.licence.outputs.ok == 'true'

      - name: Free disk space for the editor image
        if: steps.licence.outputs.ok == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/cache@v4
        if: steps.licence.outputs.ok == 'true'
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-

      - name: Run EditMode and PlayMode tests
        if: steps.licence.outputs.ok == 'true'
        run: Tools/ci/unity-tests.sh

      - name: Summary
        if: always() && steps.licence.outputs.ok == 'true'
        run: |
          for f in Artifacts/*-results.xml; do
            [ -f "$f" ] || continue
            line=$(grep -m1 -o '<test-run[^>]*>' "$f" | grep -o 'result="[^"]*"\|total="[^"]*"\|passed="[^"]*"\|failed="[^"]*"\|skipped="[^"]*"' | tr '\n' ' ')
            echo "$(basename "$f"): $line" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -o '<test-case [^>]*result="Failed"[^>]*>' "$f" | grep -o 'fullname="[^"]*"' | tee -a "$GITHUB_STEP_SUMMARY" || true
          done

      - uses: actions/upload-artifact@v4
        if: always() && steps.licence.outputs.ok == 'true'
        with:
          name: unity-test-results
          path: |
            Artifacts/*.xml
            Artifacts/*.log
            Artifacts/Screenshots
