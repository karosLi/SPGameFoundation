name: Logic tests (.NET harness)

# Compiles every assembly against Unity API stubs with Unity's assembly boundaries and runs the
# EditMode tests with dotnet test. Needs no Unity licence, so it runs on every push.
on:
  push:
  pull_request:

jobs:
  harness:
    # The isolated storage probe must not run any normal CI steps, including on a PR/manual ref.
    if: github.ref != 'refs/heads/dot/ci-disk-diagnostic' && github.head_ref != 'dot/ci-disk-diagnostic' && github.base_ref != 'dot/ci-disk-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test
        run: Tools/DotnetHarness/run.sh --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-results
          path: Tools/DotnetHarness/.gen/**/TestResults/*.trx
          # The explicit TRX-only glob is inside the generated hidden .gen directory.
          include-hidden-files: true
          if-no-files-found: error
