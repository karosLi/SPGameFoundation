name: Shooter allocation platform control (NOT product gate)

# Fixed ordinary-counter A/B control only. Push this branch to run once on the existing
# licensed native runner. Ordinary native workflows explicitly exclude this branch.
on:
  push:
    branches:
      - diagnostic/shooter-native-allocation-20261008

jobs:
  shooter-allocation-diagnostic:
    if: vars.UNITY_SELF_HOSTED == 'true' && github.ref == 'refs/heads/diagnostic/shooter-native-allocation-20261008'
    runs-on: [self-hosted, unity]
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
      SPF_SHOOTER_GC_CAPTURE: '0'
      SPF_SHOOTER_PLATFORM_CONTROL: '1'
      SPF_SHOOTER_GC_INCLUDE_EDITOR: '0'
      SPF_STORY_GC_CAPTURE: '0'
      SPF_WEAPON_GAMEPLAY_SEQUENCE: '0'
      SPF_ABILITY_GAMEPLAY_SEQUENCE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Measure raw-recorder and governor empty controls once
        shell: bash
        run: Tools/ci/local-unity-tests.sh --shooter-platform-control
      - name: Diagnostic summary (NOT full native gate)
        if: always()
        shell: bash
        run: |
          {
            echo "Ordinary-counter A/B platform control only; NOT product gate."
            echo "Head: $GITHUB_SHA; run: $GITHUB_RUN_ID; attempt: $GITHUB_RUN_ATTEMPT"
            echo "Each condition: 150 warmup, 180 observations, 24 post-window calibration frames. Original Shooter gate unchanged."
            echo "Policy: one editor invocation requiring Burst, no retry or Burst-disabled fallback."
            for f in Artifacts/shooter-platform-control-run.txt Artifacts/GC/platform-control/*/summary.json; do
              [ -f "$f" ] || continue
              echo "$(basename "$f") (first 80 lines):"
              head -n 80 "$f"
            done
            for f in Artifacts/playmode-shooter-platform-control-results.xml; do
              [ -f "$f" ] || continue
              grep -m1 -o '<test-run[^>]*>' "$f" | cut -c1-2000 || true
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package bounded diagnostic evidence
        # Includes every control CSV/settings/summary, run metadata, XML and log.
        # All files are retained; the existing 40 x 16 MiB cap fails on overflow.
        id: evidence
        if: always()
        shell: bash
        run: |
          parts="$RUNNER_TEMP/spf-shooter-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 Tools/ci/evidence_parts.py package --source Artifacts --output "$parts"
          echo "directory=$parts" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: shooter-native-allocation-diagnostic-part00
          path: ${{ steps.evidence.outputs.directory }}/part00/
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: shooter-native-allocation-diagnostic-part01
          path: ${{ steps.evidence.outputs.directory }}/part01/
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: shooter-native-allocation-diagnostic-part02
          path: ${{ steps.evidence.outputs.directory }}/part02/
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
