name: Unity tests (self-hosted runner)

# Runs the Unity suites on your own machine registered as a GitHub self-hosted runner with the label
# "unity" (its Unity Hub sign-in provides the licence, so a free Personal licence works).
# Enable by creating the repository variable UNITY_SELF_HOSTED = true (Settings → Secrets and variables
# → Actions → Variables). Optional variable UNITY_EDITOR_PATH if Unity is not in the default Hub location.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      story_gc_capture:
        description: Capture intrusive allocation stacks for the original Story test window
        type: boolean
        default: false

jobs:
  unity-tests:
    if: vars.UNITY_SELF_HOSTED == 'true'
    runs-on: [self-hosted, unity]
    permissions:
      contents: write   # publish-screenshots.sh pushes to the ci-screenshots/<branch> branch only
    timeout-minutes: 240
    env:
      UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
      # This review branch records bounded raw frames after its normal gameplay assertions.
      # Encoding occurs after acquisition; timestamps retain the actual Editor capture cadence.
      SPF_WEAPON_GAMEPLAY_SEQUENCE: ${{ (github.ref == 'refs/heads/dot/weapon-motion-stage5' || github.ref == 'refs/heads/dot/humanoid-action-cadence') && '1' || '0' }}
      # Stage E's four short opt-in sequences retain acquisition timestamps and encode afterwards.
      SPF_ABILITY_GAMEPLAY_SEQUENCE: '1'
      # Diagnostic profiling changes allocation/timing. Ordinary CI must remain uninstrumented.
      # Manually enable only to attribute the original window; the normal budget stays unchanged.
      SPF_STORY_GC_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.story_gc_capture && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false   # keep Library/ between runs: much faster imports
      - name: Run EditMode and PlayMode tests
        shell: bash
        run: Tools/ci/local-unity-tests.sh
      - name: Summary
        if: always()
        shell: bash
        run: |
          for f in Artifacts/*-results.xml; do
            [ -f "$f" ] || continue
            line=$(grep -m1 -o '<test-run[^>]*>' "$f" | grep -o 'result="[^"]*"\|total="[^"]*"\|passed="[^"]*"\|failed="[^"]*"\|skipped="[^"]*"' | tr '\n' ' ')
            echo "$(basename "$f"): $line" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -o '<test-case [^>]*result="Failed"[^>]*>' "$f" | grep -o 'fullname="[^"]*"' | tee -a "$GITHUB_STEP_SUMMARY" || true
          done
      - name: Publish screenshots
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: Tools/ci/publish-screenshots.sh || echo "::warning::screenshot publish failed"
      - name: Package bounded evidence parts
        # Restore all downloaded parts with Tools/ci/evidence_parts.py; see Docs/CiEvidence.md.
        id: evidence
        if: always()
        shell: bash
        run: |
          parts="$RUNNER_TEMP/spf-unity-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 Tools/ci/evidence_parts.py package --source Artifacts --output "$parts"
          echo "directory=$parts" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: unity-test-results-self-hosted-part00
          path: ${{ steps.evidence.outputs.directory }}/part00/
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: unity-test-results-self-hosted-part01
          path: ${{ steps.evidence.outputs.directory }}/part01/
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
